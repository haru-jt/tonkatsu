<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FufuMate</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#6366f1"><script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script><style>body{margin:0;font-family:-apple-system,sans-serif;background:linear-gradient(180deg,#eef2ff,#fff)}.wrap{max-width:430px;margin:auto;padding:16px}.hero{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;padding:20px;border-radius:24px}.card{background:#fff;border-radius:20px;padding:16px;margin-top:12px;box-shadow:0 4px 18px rgba(0,0,0,.08)}.tabs button{width:48%;padding:12px;border:none;border-radius:12px}.active{background:#6366f1;color:#fff}.task{display:flex;justify-content:space-between;align-items:center;background:#f8faff;padding:10px;border-radius:12px;margin:8px 0}.drag{cursor:grab;padding:6px}.reward{display:inline-block;background:#fff7ed;padding:10px;border-radius:12px;margin:4px}.fab{position:fixed;right:20px;bottom:20px;width:60px;height:60px;border-radius:50%;border:none;background:#6366f1;color:#fff;font-size:28px}</style></head><body><div class=wrap><div class=hero><h2>🏠 FufuMate</h2><div id=pts>0pt</div><div id=prog>進捗0%</div></div><div class=card><div class=tabs><button id=today class=active onclick="tab('today')">今日</button><button id=week onclick="tab('week')">今週</button></div><div id=taskList></div></div><div class=card><h3>🎁ご褒美</h3><div class=reward>🍰30pt</div><div class=reward>🍴100pt</div><div class=reward>🚗150pt</div></div><div class=card><h3>📊ランキング</h3><div id=rank></div></div></div><button class=fab onclick='addTask()'>＋</button><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('service-worker.js');let current='today';let tasks=JSON.parse(localStorage.getItem('ftasks')||'null')||[{id:1,name:'洗濯',owner:'夫',points:5,done:false,category:'today'},{id:2,name:'食器洗い',owner:'妻',points:3,done:false,category:'today'},{id:3,name:'週末買い出し',owner:'共通',points:10,done:false,category:'week'}];function save(){localStorage.setItem('ftasks',JSON.stringify(tasks))}function render(){let v=tasks.filter(t=>t.category===current);taskList.innerHTML=v.map(t=>`<div class=task data-id='${t.id}'><div><span class=drag>☰</span><input type=checkbox ${t.done?'checked':''} onchange='toggle(${t.id})'> ${t.name} (${t.points}pt)</div><div><button onclick='editTask(${t.id})'>✏️</button><button onclick='delTask(${t.id})'>🗑️</button></div></div>`).join('');let pts=tasks.filter(t=>t.done).reduce((a,b)=>a+b.points,0);pts.innerText=pts+'pt';document.getElementById('pts').innerText=pts+'pt';let done=v.filter(x=>x.done).length;document.getElementById('prog').innerText='進捗 '+(v.length?Math.round(done/v.length*100):0)+'%';let h=tasks.filter(t=>t.done&&t.owner==='夫').reduce((a,b)=>a+b.points,0);let w=tasks.filter(t=>t.done&&t.owner==='妻').reduce((a,b)=>a+b.points,0);rank.innerHTML='👨 '+h+'pt<br>👩 '+w+'pt';save();new Sortable(taskList,{handle:'.drag',animation:150,onEnd:e=>{let ids=v.map(x=>x.id);let moved=ids.splice(e.oldIndex,1)[0];ids.splice(e.newIndex,0,moved);let ordered=[];ids.forEach(id=>ordered.push(tasks.find(t=>t.id===id)));let others=tasks.filter(t=>t.category!==current);tasks=[...ordered,...others];save();render();}});}function toggle(id){let t=tasks.find(x=>x.id===id);t.done=!t.done;render()}function addTask(){let n=prompt('家事名');if(!n)return;tasks.push({id:Date.now(),name:n,owner:'共通',points:1,done:false,category:current});render()}function editTask(id){let t=tasks.find(x=>x.id===id);let n=prompt('家事名',t.name);if(n)t.name=n;render()}function delTask(id){tasks=tasks.filter(x=>x.id!==id);render()}function tab(c){current=c;today.classList.toggle('active',c==='today');week.classList.toggle('active',c==='week');render()}render();</script></body></html>
